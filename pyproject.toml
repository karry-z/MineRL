[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minerl-modern"
version = "0.1.0"
description = "Modern Gymnasium-native Python layer for MineRL tasks"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "coloredlogs>=15,<16",
    "gymnasium>=1,<2",
    "jinja2>=3.1,<4",
    "lxml>=5,<7",
    "numpy>=1.26,<3",
    "psutil>=6,<8",
    "tqdm>=4.66,<5",
    "xmltodict>=0.15,<1",
]

[project.optional-dependencies]
human = [
    "pyglet>=2,<3",
]
render = [
    "opencv-python-headless>=4.13,<5",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minerl = ["py.typed", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/minerl/assets"]
